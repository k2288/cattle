name: cattle
description: Cattle Management App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  mobile_scanner: ^7.0.0
  fl_chart: ^0.70.2
  shamsi_date: ^1.0.4
  persian_datetime_picker: ^3.1.0
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  chips_choice: ^3.0.1
  numeric_keyboard: ^1.1.0
  provider: ^6.1.2
  settings_ui: ^2.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/dry_cow.svg
    - assets/images/milk.svg
    - assets/images/milking_cow.svg
    - assets/images/total_cow.svg
    - assets/images/cow.jpeg
    - assets/images/milking.svg
    - assets/images/fertilization.svg
    - assets/images/state/bull.png
    - assets/images/state/calf.png
    - assets/images/state/cow.png
    - assets/images/state/heifer.png
    - assets/images/state/breeding.png
    - assets/images/state/calved.png
    - assets/images/state/onmilking.png
    - assets/images/state/pragnent.png
    - assets/images/state/weaned.png
    - assets/images/

  fonts:
    - family: Iran_Sans
      fonts:
        - asset: assets/fonts/Iran_Sans.ttf
